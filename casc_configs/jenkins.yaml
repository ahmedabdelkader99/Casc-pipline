jenkins:
  systemMessage: "Managed by Jenkins Configuration as Code"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: ${JENKINS_ADMIN_ID}
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: "proxmox-user"
              description: "Proxmox Username"
              secret: "root@pam"
          - string:
              id: "proxmox-password"
              description: "Proxmox Password"
              secret: "${PROXMOX_PASSWORD}"
          - usernamePassword:
              id: "codek9-creds"
              description: "CodeK9 Credentials"
              username: "${CODEK9_USERNAME}"
              password: "${CODEK9_PASSWORD}"
              #this will be modefied to use k9 key instead github ssh key
          - basicSSHUserPrivateKey:
              id: "github-ssh"
              description: "GitHub SSH Key"
              username: "ahmedabdelkader99"
              privateKeySource:
                directEntry:
                  privateKey: "${GITHUB_SSH_PRIVATE_KEY}"
jobs:
  - script: >-
      pipelineJob('VM-Provisioning') {

        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('git@github.com:ahmedabdelkader99/Casc-pipline.git')
                  credentials('github-ssh')
                }
                branch('*/main')
              }
            }
            scriptPath('pipline.groovy')
          }
        }
      }
